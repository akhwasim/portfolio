<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{TITLE}} — Research note — Wasim Akhtar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF8F4;
    --ink: #1C1B19;
    --graphite: #5C5953;
    --accent: #5B6F55;
    --accent-soft: #E8EDE4;
    --hairline: #E3DFD6;
    --card: #FFFFFF;
    --research-text: #6E5A3C;
    --research-bg: #F1EADA;
    --placeholder-text: #A35B3C;
    --placeholder-bg: #FBEFE7;

    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }

  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 28px;
  }

  /* ---------- NAV ---------- */
  nav {
    border-bottom: 1px solid var(--hairline);
    position: sticky;
    top: 0;
    background: rgba(250, 248, 244, 0.92);
    backdrop-filter: blur(6px);
    z-index: 10;
  }
  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    max-width: 760px;
    margin: 0 auto;
  }
  .nav-prompt {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--graphite);
  }
  .nav-prompt .sym { color: var(--accent); }
  .nav-prompt-link {
    border-bottom: none;
    transition: color 0.15s;
  }
  .nav-prompt-link:hover, .nav-prompt-link:focus-visible {
    color: var(--ink);
    border-bottom: none;
  }
  .nav-right {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .nav-links {
    display: flex;
    gap: 20px;
    font-family: var(--font-mono);
    font-size: 13px;
  }
  .nav-links a {
    color: var(--graphite);
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
    transition: color 0.15s, border-color 0.15s;
  }
  .nav-links a:hover, .nav-links a:focus-visible {
    color: var(--ink);
    border-color: var(--accent);
  }
  .nav-links a.current { color: var(--ink); border-color: var(--accent); }
  .nav-divider {
    width: 1px;
    height: 16px;
    background: var(--hairline);
  }
  .nav-icon-link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    color: var(--graphite);
    transition: background-color 0.15s, color 0.15s;
  }
  .nav-icon-link:hover, .nav-icon-link:focus-visible {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .nav-icon-link svg {
    width: 16px;
    height: 16px;
  }

  /* ---------- BREADCRUMB ---------- */
  .breadcrumb {
    padding: 28px 0 0;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--graphite);
  }
  .breadcrumb a { color: var(--accent); }
  .breadcrumb a:hover { text-decoration: underline; }
  .breadcrumb a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 2px;
  }

  /* ---------- ENTRY HEADER ---------- */
  header.entry-head {
    padding: 24px 0 36px;
    border-bottom: 1px solid var(--hairline);
  }
  .entry-meta-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--graphite);
  }
  .status-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 4px;
    color: var(--research-text);
    background: var(--research-bg);
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(28px, 4vw, 38px);
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  /* ---------- CONTENT SECTIONS ---------- */
  .note-section {
    padding: 36px 0;
    border-bottom: 1px solid var(--hairline);
  }
  .note-section:last-of-type { border-bottom: none; }
  .section-label {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--graphite);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::before { content: "//"; color: var(--accent); }

  .placeholder {
    font-size: 15px;
    color: var(--placeholder-text);
    background: var(--placeholder-bg);
    border: 1px dashed #E0B69A;
    border-radius: 8px;
    padding: 16px 18px;
    font-style: italic;
  }

  .note-body {
    font-size: 16px;
    color: var(--ink);
    max-width: 600px;
    white-space: pre-line;
  }

  .note-body ul {
    margin: 0 0 8px;
    padding-left: 22px;
  }
  .note-body li {
    margin-bottom: 8px;
  }
  .note-body li::marker {
    color: var(--accent);
  }

  .note-section p {
    font-size: 16px;
    color: var(--ink);
    max-width: 600px;
  }

  footer {
    padding: 40px 0 48px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--graphite);
    text-align: center;
  }

  @media (max-width: 600px) {
    .nav-links { gap: 12px; }
    .nav-right { gap: 12px; }
    header.entry-head { padding: 20px 0 28px; }
    .note-section { padding: 28px 0; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="../index.html" class="nav-prompt nav-prompt-link"><span class="sym">~</span>/wasim-akhtar</a>
    <div class="nav-right">
      <div class="nav-links">
        <a href="../index.html#about">about</a>
        <a href="../index.html#projects">projects</a>
        <a href="../research.html" class="current">research</a>
        <a href="../index.html#skills">skills</a>
        <a href="../index.html#contact">contact</a>
        <a href="/Wasim_Akhtar_Resume.pdf">resume</a>
      </div>
      <div class="nav-divider"></div>
      <a href="https://github.com/yourusername" class="nav-icon-link" aria-label="GitHub" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>
    </div>
  </div>
</nav>

<div class="wrap">

  <div class="breadcrumb">
    <a href="../research.html">← all research notes</a>
  </div>

  <header class="entry-head">
    <div class="entry-meta-row">
      <span class="status-pill">{{STATUS}}</span>
      <span>last updated {{DATE}}</span>
    </div>
    <h1>{{TITLE}}</h1>
  </header>

  <section class="note-section">
    <div class="section-label">idea</div>
    <div class="{{IDEA_CLASS}}">
      {{IDEA}}
    </div>
  </section>

  <section class="note-section">
    <div class="section-label">why</div>
    <div class="{{WHY_CLASS}}">
      {{WHY}}
    </div>
  </section>

  <section class="note-section">
    <div class="section-label">how / current thinking</div>
    <div class="{{HOW_CLASS}}">
      {{HOW}}
    </div>
  </section>

  <section class="note-section">
    <div class="section-label">open questions</div>
    <div class="{{OPEN_QUESTIONS_CLASS}}">
      {{OPEN_QUESTIONS}}
    </div>
  </section>

</div>

<footer>
  © 2026 Wasim Akhtar
</footer>

</body>
</html>
